name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No sentence text shared across train/val/test
        run: python3 corpus/check_split.py
      - name: Datasets used by published models are unchanged
        run: |
          set -e
          for f in datasets/*/SHA256SUMS; do (cd "$(dirname "$f")" && sha256sum -c --quiet SHA256SUMS); done
      - name: Published v1 score reproduces
        run: python3 eval/eval_chrf.py --pred eval/preds/v1-io-eo/nllb-600m.jsonl | grep -q "chrF=73.40"
